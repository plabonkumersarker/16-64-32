<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathe</title>
<style>
:root{
  --bg:#EEF4F5; --ink:#15303A; --muted:#58737C; --orb1:#B5E0E2; --orb2:#2F8A92;
  --glow:rgba(47,138,146,.30); --track:rgba(21,48,58,.12); --ring:#2F8A92; --line:rgba(21,48,58,.18);
}
[data-theme="night"]{
  --bg:#0C1522; --ink:#E3EEF2; --muted:#8FA6B0; --orb1:#7DB6C4; --orb2:#2A5F73;
  --glow:rgba(125,182,196,.22); --track:rgba(227,238,242,.12); --ring:#8CC4D2; --line:rgba(227,238,242,.2);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); transition:background .4s,color .4s;
  font-family:ui-rounded,"Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:20px 20px 32px; min-height:100vh;
}
header{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:1.1rem;font-weight:600;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.theme{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.theme svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[data-theme="day"] .moon,[data-theme="night"] .sun{display:none}

main{display:flex;flex-direction:column;align-items:center;gap:22px}
.stage{position:relative;width:min(78vw,340px);aspect-ratio:1;display:grid;place-items:center}
.orb{
  position:absolute;inset:11%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--orb1),var(--orb2));
  box-shadow:0 0 60px 8px var(--glow);
  transform:scale(.6); will-change:transform;
}
.orb.idle{transition:transform .8s ease}
svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:1.2}
.ring .track{stroke:var(--track)}
.ring .bar{stroke:var(--ring);stroke-linecap:round}
.count{position:relative;font-size:3rem;font-weight:500;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 1px 12px rgba(0,0,0,.25)}
[data-theme="day"] .count{color:#0E2A31;text-shadow:none}
.phase{font-size:1.5rem;font-weight:500;min-height:1.9rem}
.meta{color:var(--muted);font-size:.9rem;min-height:1.2rem;font-variant-numeric:tabular-nums}

.controls{width:100%;max-width:420px;display:flex;flex-direction:column;gap:20px;align-items:center}
.set{width:100%;display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:baseline}
label{font-size:.95rem}
output{font-weight:600;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ring);height:28px}
.ratio{color:var(--muted);font-size:.9rem;text-align:center;font-variant-numeric:tabular-nums}
.ratio b{color:var(--ink);font-weight:600}
.go{
  min-width:160px;padding:14px 34px;border-radius:999px;border:0;
  background:var(--ink);color:var(--bg);font-size:1.05rem;font-weight:600;transition:opacity .2s
}
.go:hover{opacity:.88}
@media (prefers-reduced-motion:reduce){.orb.idle{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Breathe</h1>
  <button class="theme" id="theme" aria-label="Switch to night mode" title="Day / night">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
  </button>
</header>

<main>
  <div class="stage">
    <div class="orb idle" id="orb"></div>
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="48.5"/>
      <circle class="bar" id="bar" cx="50" cy="50" r="48.5"/>
    </svg>
    <div class="count" id="count" aria-hidden="true"></div>
  </div>
  <div class="phase" id="phase" aria-live="polite">Ready</div>
  <div class="meta" id="meta"></div>
</main>

<section class="controls">
  <div class="set">
    <div class="row"><label for="x">Comfort time (x)</label><output id="xv" for="x">4 s</output></div>
    <input type="range" id="x" min="1" max="10" step="1" value="4">
    <div class="ratio" id="ratio"></div>
  </div>
  <button class="go" id="go">Start</button>
</section>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var root = document.documentElement;
  var orb=$('orb'), bar=$('bar'), count=$('count'), phaseEl=$('phase'), meta=$('meta');
  var slider=$('x'), xv=$('xv'), ratio=$('ratio'), go=$('go'), themeBtn=$('theme');
  var MIN=0.6, C=2*Math.PI*48.5;
  var NAMES=['Breathe in','Hold','Breathe out'];
  var x=4, running=false, t0=0, raf=0;

  bar.style.strokeDasharray=C; bar.style.strokeDashoffset=C;

  /* ---------- theme ---------- */
  var theme;
  try{ theme=localStorage.getItem('breathe-theme'); }catch(e){}
  if(!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
  function setTheme(t){
    theme=t; root.setAttribute('data-theme',t);
    themeBtn.setAttribute('aria-label', t==='day' ? 'Switch to night mode' : 'Switch to day mode');
    try{ localStorage.setItem('breathe-theme',t); }catch(e){}
  }
  setTheme(theme);
  themeBtn.onclick=function(){ setTheme(theme==='day'?'night':'day'); };

  /* ---------- settings ---------- */
  try{ var s=parseInt(localStorage.getItem('breathe-x'),10); if(s>=1&&s<=10) x=s; }catch(e){}
  slider.value=x;
  function renderSettings(){
    xv.textContent=x+' s';
    ratio.innerHTML='Inhale : Hold : Exhale = <b>'+x+' : '+(4*x)+' : '+(2*x)+'</b> seconds';
    try{ localStorage.setItem('breathe-x',x); }catch(e){}
  }
  renderSettings();
  slider.oninput=function(){
    x=parseInt(slider.value,10); renderSettings();
    if(running) t0=performance.now();   /* restart the cycle with the new timing */
  };

  /* ---------- animation ---------- */
  function ease(p){ return 0.5-0.5*Math.cos(Math.PI*p); }
  function frame(now){
    if(!running) return;
    var d=[x*1000,4*x*1000,2*x*1000], total=7*x*1000;
    var el=now-t0, t=el%total, i=0;
    while(t>=d[i]){ t-=d[i]; i++; }
    var p=t/d[i], sc;
    if(i===0) sc=MIN+(1-MIN)*ease(p);
    else if(i===1) sc=1;
    else sc=1-(1-MIN)*ease(p);
    orb.style.transform='scale('+sc.toFixed(4)+')';
    bar.style.strokeDashoffset=C*(1-p);
    count.textContent=Math.ceil((d[i]-t)/1000);
    if(phaseEl.textContent!==NAMES[i]) phaseEl.textContent=NAMES[i];
    meta.textContent='Cycle '+(Math.floor(el/total)+1);
    raf=requestAnimationFrame(frame);
  }
  function start(){
    running=true; t0=performance.now();
    orb.classList.remove('idle'); go.textContent='Stop';
    raf=requestAnimationFrame(frame);
  }
  function stop(){
    running=false; cancelAnimationFrame(raf);
    orb.classList.add('idle'); orb.style.transform='scale('+MIN+')';
    bar.style.strokeDashoffset=C; count.textContent='';
    phaseEl.textContent='Ready'; meta.textContent=''; go.textContent='Start';
  }
  go.onclick=function(){ running ? stop() : start(); };
  stop();
})();
</script>
</body>
</html>
